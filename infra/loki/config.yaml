# Loki（單機版）：本機／sandbox／CI 的 debug log 儲存（M14）
# 只對少數標籤建索引（service、level）；correlation_id 留在內容裡，用 | json 過濾（高基數不能當標籤）
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: ${LOKI_RETENTION:-72h}     # .env 的 LOKI_RETENTION；過期自動刪除
  allow_structured_metadata: true
  # 拒收超過 10 分鐘的舊 log：DEBUG_LOG 從關切到開時，Alloy 會讀到 Docker 保存的舊輸出，
  # 那段時間是「關閉」的，不該補收進來
  # 例外：查看 CI 的 log（compose.viewer.yaml）匯入的都是舊資料，那裡設成 false
  reject_old_samples: ${LOKI_REJECT_OLD_SAMPLES:-true}
  reject_old_samples_max_age: 10m

compactor:
  working_directory: /loki/compactor
  retention_enabled: true                       # 沒開這個，retention_period 不會生效
  delete_request_store: filesystem
  compaction_interval: 10m

analytics:
  reporting_enabled: false                      # 不回傳使用統計給 Grafana Labs
