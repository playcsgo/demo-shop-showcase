# nginx → PHP-FPM（core-api 容器的 9000 port）
server {
    listen 80;
    root /var/www/html/public;
    index index.php;

    # core-api 容器重建後 IP 會變；用 Docker 內建 DNS＋變數，每 10 秒重新解析（不然 nginx 一直連舊 IP → 502）
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream core-api:9000;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass $php_upstream;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        # nginx 收到請求的時間（秒.毫秒）：core 從這裡開始算處理時間，含等 FPM 有空的 worker
        fastcgi_param HTTP_X_REQUEST_START "t=${msec}";
        fastcgi_read_timeout 30s;
    }

    # FPM 狀態（連線數實驗觀察忙碌 worker 與排隊數用）
    location ~ ^/(fpm-status|fpm-ping)$ {
        fastcgi_pass $php_upstream;
        fastcgi_param SCRIPT_FILENAME $fastcgi_script_name;
        include fastcgi_params;
    }
}
