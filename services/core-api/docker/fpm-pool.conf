; FPM worker 數量 = 這個容器最多會開幾條 MySQL 連線（連線預算的基礎，見 system-design §12.2）
[www]
pm = static
pm.max_children = ${FPM_MAX_CHILDREN}
pm.status_path = /fpm-status
ping.path = /fpm-ping

; worker 的 stderr（Laravel log）原樣輸出到容器 log，讓 Datadog Agent 收得到
catch_workers_output = yes
decorate_workers_output = no

; 保留容器的環境變數（DD_*、DEMO_DB_LATENCY_MS）；FPM 預設會清掉
clear_env = no
