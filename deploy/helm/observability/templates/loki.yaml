# Loki（單機版）：和 docker compose 用同一份設定（infra/loki/config.yaml）
apiVersion: v1
kind: ConfigMap
metadata: { name: loki-config }
data:
  config.yaml: |
{{ .Values.lokiConfig | indent 4 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: loki-data }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 2Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: loki, labels: { app: loki } }
spec:
  replicas: 1
  strategy: { type: Recreate }   # 硬碟只能掛在一個 Pod 上
  selector: { matchLabels: { app: loki } }
  template:
    metadata: { labels: { app: loki } }
    spec:
      securityContext: { fsGroup: 10001 }   # Loki 用 uid 10001 跑，要能寫硬碟
      containers:
        - name: loki
          image: {{ .Values.images.loki }}
          args: ["-config.file=/etc/loki/config.yaml", "-config.expand-env=true"]
          env:
            - { name: LOKI_RETENTION, value: {{ .Values.retention | quote }} }
          ports: [{ containerPort: 3100 }]
          readinessProbe:
            httpGet: { path: /ready, port: 3100 }
            periodSeconds: 5
          resources: { requests: { cpu: 50m, memory: 128Mi } }
          volumeMounts:
            - { name: config, mountPath: /etc/loki }
            - { name: data, mountPath: /loki }
      volumes:
        - name: config
          configMap: { name: loki-config }
        - name: data
          persistentVolumeClaim: { claimName: loki-data }
---
apiVersion: v1
kind: Service
metadata: { name: loki }
spec:
  selector: { app: loki }
  ports: [{ port: 3100 }]
