# ProxySQL：core 和 MySQL 之間的連線池（本機替代 RDS Proxy）
# 設定檔和 docker compose 同一份（infra/proxysql/proxysql.cnf），由 Terraform 讀檔案帶進來（.Values.proxysql.config）
# 開 2 個：所有 core 的資料庫流量都經過它，只有 1 個就是單點故障；壞一個還有一個
#   每個各自最多 100 條後端連線 → 合計 200，MySQL 上限 400
#   PHP 每個請求都重新連線，Service 每條新連線隨機二選一，所以兩個分得很平均
# 高可用的設定：
#   - readiness：連不上就移出名單（不重啟）；liveness：卡住太久就重啟（條件比 readiness 寬，忙一下不會被重啟）
#   - 盡量排在不同 Node（一台壞掉不會兩個一起掛）；Node 維護時最少留 1 個（PodDisruptionBudget）
#   - Node 失聯 30 秒就搬到別的 Node（預設要等 5 分鐘）
apiVersion: v1
kind: ConfigMap
metadata: { name: proxysql-config }
data:
  proxysql.cnf: |
{{ .Values.proxysql.config | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: proxysql, labels: { app: proxysql, demo/service: proxysql } }
spec:
  replicas: {{ .Values.proxysql.replicas }}
  selector: { matchLabels: { app: proxysql } }
  template:
    metadata:
      labels: { app: proxysql, demo/service: proxysql }
      annotations:
        checksum/config: {{ .Values.proxysql.config | sha256sum }}   # 設定改了就重啟
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector: { matchLabels: { app: proxysql } }
                topologyKey: kubernetes.io/hostname
      tolerations:
        - { key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 30 }
        - { key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 30 }
      containers:
        - name: proxysql
          image: proxysql/proxysql:3.0.11
          ports: [{ containerPort: 6033 }]
          readinessProbe:
            tcpSocket: { port: 6033 }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: 6033 }
            periodSeconds: 5
            failureThreshold: 6   # 連續 30 秒都沒回應才重啟
          resources: { requests: { cpu: 100m, memory: 128Mi } }
          volumeMounts:
            - { name: config, mountPath: /etc/proxysql.cnf, subPath: proxysql.cnf }
      volumes:
        - name: config
          configMap: { name: proxysql-config }
---
apiVersion: v1
kind: Service
metadata: { name: proxysql, labels: { app: proxysql } }
spec:
  selector: { app: proxysql }
  ports: [{ port: 6033 }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: proxysql }
spec:
  minAvailable: 1
  selector: { matchLabels: { app: proxysql } }
