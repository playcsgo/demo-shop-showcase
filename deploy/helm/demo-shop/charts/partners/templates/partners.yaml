# partners（假廠商）：設定存在記憶體，所以只開 1 個（開多個的話，控制台的設定只會改到其中一個）
apiVersion: v1
kind: Service
metadata: { name: partners, labels: { app: partners } }
spec:
  selector: { app: partners }
  ports: [{ port: 4000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: partners, labels: { app: partners, demo/service: partners } }
spec:
  replicas: 1
  selector: { matchLabels: { app: partners } }
  template:
    metadata: { labels: { app: partners, demo/service: partners } }
    spec:
      containers:
        - name: partners
          image: {{ .Values.global.image.repository }}/partners:{{ .Values.global.image.tag }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          env:
            - { name: LOG_LEVEL, value: {{ .Values.global.logLevel }} }
            - { name: HUB_WEBHOOK_BASE, value: "http://hub:3000/webhooks" }
            - { name: MOCKPAY_WEBHOOK_SECRET, value: {{ .Values.global.secrets.mockpayWebhookSecret }} }
            - { name: MOCKLOGI_WEBHOOK_SECRET, value: {{ .Values.global.secrets.mocklogiWebhookSecret }} }
            - { name: TIME_SCALE, value: {{ .Values.global.timeScale | quote }} }
          ports: [{ containerPort: 4000 }]
          readinessProbe:
            httpGet: { path: /health, port: 4000 }
            periodSeconds: 5
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { memory: 512Mi } }
