# core 的三個常駐程序：同一個 image、不同指令
#   relay：outbox → SQS；worker：消費 integration-events（inbox）；scheduler：對帳、訂閱、指標（只開 1 個，onOneServer 也會用鎖擋）
#   worker、relay 的 Pod 數交給 KEDA（worker 看 integration-events 的積壓、relay 看 outbox 的積壓，見下面的 ScaledObject），
#   這裡不寫 replicas：寫了的話，每次 helm upgrade 都會被改回固定值
{{- range $name, $w := dict "core-relay" (list "outbox:relay" 1) "core-worker" (list "events:consume" 2) "core-scheduler" (list "schedule:work" 1) }}
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: {{ $name }}, labels: { app: {{ $name }}, demo/service: {{ $name }} } }
spec:
  {{- if eq $name "core-scheduler" }}
  replicas: {{ index $w 1 }}
  {{- end }}
  selector: { matchLabels: { app: {{ $name }} } }
  template:
    metadata: { labels: { app: {{ $name }}, demo/service: {{ $name }} } }
    spec:
      {{- include "core.migrate" $ | nindent 6 }}
      containers:
        - name: php
          image: {{ include "core.image" $ }}
          imagePullPolicy: {{ $.Values.global.image.pullPolicy }}
          command: ["/var/www/html/docker/sandbox-entrypoint.sh", "php", "artisan", "{{ index $w 0 }}"]
          {{- include "core.env" $ | nindent 10 }}
            - { name: SERVICE_NAME, value: {{ $name }} }
            {{- include "demo.datadog.env" (dict "root" $ "service" $name "kind" "php-cli") | nindent 12 }}
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { memory: 512Mi } }
{{- end }}
---
# core-worker 依「廠商結果回到 core 的佇列」積壓了幾則擴充（和 hub 各廠商同一套做法）
# 壓測時發現：hub 依佇列擴充、把指令都做完了，回程的 core-worker 卻固定 2 個，積壓到 7 萬多則，
# 訂單一直停在「等待付款」（付款其實成功了，core 還沒讀到結果）
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata: { name: core-worker }
spec:
  scaleTargetRef: { name: core-worker }
  minReplicaCount: {{ .Values.worker.min }}
  maxReplicaCount: {{ .Values.worker.max }}
  pollingInterval: 5
  cooldownPeriod: 60
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp: { stabilizationWindowSeconds: 0 }
        scaleDown:
          stabilizationWindowSeconds: 120
          policies: [{ type: Percent, value: 50, periodSeconds: 30 }]
  triggers:
    - type: aws-sqs-queue
      authenticationRef: { name: hub-keda-aws }   # 和 hub 共用同一組 SQS 帳號（hub chart 建的）
      metadata:
        queueURL: {{ .Values.global.aws.sqsPrefix }}/integration-events
        queueLength: "{{ .Values.worker.perPod }}"
        awsRegion: {{ .Values.global.aws.region }}
        awsEndpoint: http://localstack.{{ .Release.Namespace }}.svc.cluster.local:4566
        scaleOnInFlight: "true"
---
# core-relay 依 outbox 裡「還沒送出」的筆數擴充：KEDA 直接查 MySQL（不經過 ProxySQL：只是讀一個數字，不要佔連線池）
# 有積壓卻不擴的話，付款、出貨指令都卡在 core 出不去，hub 再快也沒用
apiVersion: v1
kind: Secret
metadata: { name: core-keda-mysql }
stringData:
  password: {{ .Values.relay.dbPassword | default "demo" | quote }}
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata: { name: core-keda-mysql }
spec:
  secretTargetRef:
    - { parameter: password, name: core-keda-mysql, key: password }
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata: { name: core-relay }
spec:
  scaleTargetRef: { name: core-relay }
  minReplicaCount: {{ .Values.relay.min }}
  maxReplicaCount: {{ .Values.relay.max }}
  pollingInterval: 5
  cooldownPeriod: 60
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp: { stabilizationWindowSeconds: 0 }
        scaleDown:
          stabilizationWindowSeconds: 120
          policies: [{ type: Percent, value: 50, periodSeconds: 30 }]
  triggers:
    - type: mysql
      authenticationRef: { name: core-keda-mysql }
      metadata:
        host: mysql.{{ .Release.Namespace }}.svc.cluster.local
        port: "3306"
        username: demo
        dbName: demo
        query: "SELECT COUNT(*) FROM outbox_messages WHERE status = 'PENDING'"
        queryValue: "{{ .Values.relay.perPod }}"
