# BFF（NestJS；webRuntime=next 時是 Next.js，同時提供頁面）：前台唯一的入口，session 在 Redis，無狀態 → HPA 看 CPU 水平擴充
apiVersion: v1
kind: Service
metadata: { name: bff, labels: { app: bff } }
spec:
  selector: { app: bff }
  ports: [{ port: 3000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: bff, labels: { app: bff, demo/service: bff } }
spec:
  replicas: {{ .Values.minReplicas }}
  selector: { matchLabels: { app: bff } }
  template:
    metadata: { labels: { app: bff, demo/service: bff } }
    spec:
      containers:
        - name: bff
          image: {{ .Values.global.image.repository }}/bff-gateway:{{ .Values.global.image.tag }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          env:
            - { name: LOG_LEVEL, value: {{ .Values.global.logLevel }} }
            - { name: CORE_URL, value: "http://core" }
            - { name: REDIS_URL, value: "redis://redis:6379/3" }
            - { name: BFF_SERVICE_KEY, value: {{ .Values.global.secrets.bffServiceKey }} }
            - { name: COOKIE_SECURE, value: "0" }
            - { name: WEB_RUNTIME, value: {{ .Values.global.webRuntime }} }   # 壓測工具讀這個判斷是哪一版；next：image 是 services/web-next
            - { name: AWS_DEFAULT_REGION, value: {{ .Values.global.aws.region }} }
            - { name: AWS_ENDPOINT, value: {{ .Values.global.aws.endpoint }} }
            - { name: SQS_PREFIX, value: {{ .Values.global.aws.sqsPrefix }} }
            {{- include "demo.datadog.env" (dict "root" . "service" "bff" "kind" "node") | nindent 12 }}
          ports: [{ containerPort: 3000 }]
          lifecycle:
            preStop: { exec: { command: ["sleep", "10"] } }   # 縮容時先等入口把這個 Pod 拿掉
          readinessProbe:
            tcpSocket: { port: 3000 }
            periodSeconds: 5
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { memory: 512Mi } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: bff }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: bff }
  minReplicas: {{ .Values.minReplicas }}
  maxReplicas: {{ .Values.maxReplicas }}
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: {{ .Values.targetCPU }} } }
